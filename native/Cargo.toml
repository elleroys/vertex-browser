[package]
name = "vertex-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Native Rust shell prototype for Vertex Browser using Servo"

[dependencies]
vortex-engine = { path = "crates/vortex-engine" }
winit = "0.30.13"
euclid = "0.22"
url = "2.5"
idna = "1.1"
content-security-policy = "0.9"
egui = "0.34.3"
egui_glow = { version = "0.34.3", features = ["winit"] }
rusqlite = { version = "0.38", features = ["bundled"] }
argon2 = "0.5"
base64 = "0.22"
arboard = "3.6"
chacha20poly1305 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
csv = "1"
rfd = "0.15"
serde_json = "1"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
open = "5"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
members = ["crates/vortex-engine"]
resolver = "3"
